<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background glass gradient -->
    <radialGradient id="cardGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a1b12" />
      <stop offset="60%" stop-color="#140a06" />
      <stop offset="100%" stop-color="#080402" />
    </radialGradient>
    
    <!-- Luxurious Gold Leaf Gradient -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1cf" />
      <stop offset="30%" stop-color="#e8be66" />
      <stop offset="70%" stop-color="#c48a28" />
      <stop offset="100%" stop-color="#f5dc9a" />
    </linearGradient>

    <!-- Inner Shadow & Highlight -->
    <linearGradient id="appleStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)" />
      <stop offset="100%" stop-color="rgba(217, 164, 65, 0.18)" />
    </linearGradient>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#cardGlow)" />
  <rect x="2" y="2" width="124" height="124" rx="28" stroke="url(#appleStroke)" stroke-width="1.5" />

  <!-- Outer Sacred Blencong Aura -->
  <circle cx="64" cy="62" r="38" fill="rgba(217, 164, 65, 0.05)" />
  <circle cx="64" cy="62" r="28" fill="rgba(242, 199, 107, 0.08)" filter="url(#softGlow)" />

  <!-- The Gunungan Peak & Dalang Hand Mudra Fusion (Minimalist Apple Aesthetic) -->
  <!-- Gunungan outer sacred curve -->
  <path d="M64 18 C58 32, 48 44, 38 56 C32 64, 28 74, 30 84 C32 94, 40 101, 51 102 C56 102.5, 60 100, 64 97 C68 100, 72 102.5, 77 102 C88 101, 96 94, 98 84 C100 74, 96 64, 90 56 C80 44, 70 32, 64 18 Z" 
        fill="url(#goldSheen)" 
        filter="url(#softGlow)" />

  <!-- Negative Space: The Dalang Hand Gesture & Center Tree of Life (Kayon) -->
  <!-- Gapit center spine -->
  <path d="M64 24 L64 108" stroke="#120804" stroke-width="3" stroke-linecap="round" />
  
  <!-- Stylized Wing / Mudra Hands inside the Gunungan -->
  <path d="M64 50 C54 42, 42 46, 38 56 C44 58, 54 58, 64 64" fill="none" stroke="#120804" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M64 50 C74 42, 86 46, 90 56 C84 58, 74 58, 64 64" fill="none" stroke="#120804" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Optical Touchpoint (The Hand Landmark Pulse) -->
  <circle cx="64" cy="40" r="3" fill="#120804" />
  <circle cx="64" cy="74" r="3.5" fill="#120804" />
  <circle cx="51" cy="84" r="2.5" fill="#120804" />
  <circle cx="77" cy="84" r="2.5" fill="#120804" />

  <!-- Elegant Apple-style rim highlight -->
  <path d="M64 22 C67 33, 76 43, 86 54 C91 61, 95 69, 94 77" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.2" stroke-linecap="round" />
</svg>
